---
- name: Configure Redis on Private Instances via Bastion
  hosts: all
  become: yes
  tasks:

    # ==========================================
    # 1. SET SSH USER DYNAMICALLY
    # ==========================================
    - name: Set SSH User for Ubuntu
      set_fact:
        ansible_user: ubuntu
      when: "'os_ubuntu' in group_names"

    - name: Set SSH User for Amazon Linux
      set_fact:
        ansible_user: ec2-user
      when: "'os_amazon_linux' in group_names"

    # ==========================================
    # 2. UBUNTU SETUP
    # ==========================================
    - name: Update APT cache and install Redis (Ubuntu)
      apt:
        name: redis-server
        state: present
        update_cache: yes
      when: "'os_ubuntu' in group_names"

    - name: Ensure Redis service is started & enabled (Ubuntu)
      service:
        name: redis-server
        state: started
        enabled: yes
      when: "'os_ubuntu' in group_names"

    # ==========================================
    # 3. AMAZON LINUX 2023 SETUP
    # ==========================================
    - name: Install Redis 6 (Amazon Linux 2023)
      dnf:
        name: redis6
        state: present
      when: "'os_amazon_linux' in group_names"

    - name: Ensure Redis service is started & enabled (Amazon Linux 2023)
      service:
        name: redis6
        state: started
        enabled: yes
      when: "'os_amazon_linux' in group_names"

    # ==========================================
    # 4. QUICK VERIFICATION
    # ==========================================
    - name: Verify Redis service status (Ubuntu)
      command: systemctl is-active redis-server
      register: redis_ubuntu
      when: "'os_ubuntu' in group_names"
      changed_when: false

    - name: Verify Redis service status (Amazon Linux)
      command: systemctl is-active redis6
      register: redis_al
      when: "'os_amazon_linux' in group_names"
      changed_when: false

    - name: Show Installation Status
      debug:
        msg: "Redis Status: {{ redis_ubuntu.stdout if 'os_ubuntu' in group_names else redis_al.stdout }}"